name: Repo Detective CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: repo_detective
          POSTGRES_USER: repo_user
          POSTGRES_PASSWORD: local_dev_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d repo_detective"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify